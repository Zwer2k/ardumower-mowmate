name: CI

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build ESP32 UI
        working-directory: ui
        env:
          VITE_ENABLE_MAP: 'false'
          VITE_ENABLE_LIVE_MAP: 'false'
          VITE_ENABLE_GPS_DASHBOARD: 'false'
        run: npm run build

      - name: Package ESP32 UI
        working-directory: util/package_ui
        run: go run .

      - name: Build ESP32 firmware
        run: pio run -e esp32

      - name: Collect ESP32 artifacts
        run: |
          mkdir -p artifacts/esp32
          cp -v .pio/build/esp32/firmware.bin artifacts/esp32/
          cp -v .pio/build/esp32/firmware.elf artifacts/esp32/
          cp -v .pio/build/esp32/partitions.bin artifacts/esp32/
          cp -v .pio/build/esp32/bootloader.bin artifacts/esp32/

      - name: Build ESP32-S3 UI
        working-directory: ui
        env:
          VITE_ENABLE_MAP: 'true'
          VITE_ENABLE_LIVE_MAP: 'true'
          VITE_ENABLE_GPS_DASHBOARD: 'true'
        run: npm run build

      - name: Package ESP32-S3 UI
        working-directory: util/package_ui
        run: go run .

      - name: Build ESP32-S3 firmware
        run: pio run -e esp32-S3-N16-R8

      - name: Collect ESP32-S3 artifacts
        run: |
          mkdir -p artifacts/esp32-s3
          cp -v .pio/build/esp32-S3-N16-R8/firmware.bin artifacts/esp32-s3/
          cp -v .pio/build/esp32-S3-N16-R8/firmware.elf artifacts/esp32-s3/
          cp -v .pio/build/esp32-S3-N16-R8/partitions.bin artifacts/esp32-s3/
          cp -v .pio/build/esp32-S3-N16-R8/bootloader.bin artifacts/esp32-s3/

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: artifacts/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: artifacts

      - name: Prepare release assets
        run: |
          for platform in esp32 esp32-s3; do
            test -d "artifacts/$platform"
            for file in "artifacts/$platform"/*; do
              test -f "$file"
              filename="${file##*/}"
              mv "$file" "artifacts/$platform/$platform-$filename"
            done
          done

          (cd artifacts && zip -r -q esp32.zip esp32)
          (cd artifacts && zip -r -q esp32-s3.zip esp32-s3)

      - name: Generate release notes body
        run: |
          tag=${GITHUB_REF#refs/tags/}
          body_file="release_notes/${tag}.md"
          if [ -f "$body_file" ]; then
            cat "$body_file" > release_body.txt
          else
            # find previous tag (most recent v* different from current)
            prev=$(git tag --sort=-creatordate | grep '^v' | grep -v "^$tag$" | head -n1 || true)
            if [ -n "$prev" ]; then
              git --no-pager log --pretty=format:'- %h %s' "$prev..$tag" > release_body.txt
            else
              git --no-pager log --pretty=format:'- %h %s' -n 50 "$tag" > release_body.txt
            fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/esp32/*
            artifacts/esp32-s3/*
            artifacts/*.zip
          body_path: release_body.txt
          fail_on_unmatched_files: true

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: artifacts

      - name: Get date and commit hash
        id: version
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "short_hash=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with platform prefix
        run: |
          for platform in esp32 esp32-s3; do
            test -d "artifacts/$platform"
            for file in "artifacts/$platform"/*; do
              test -f "$file"
              filename="${file##*/}"
              mv "$file" "artifacts/$platform/$platform-$filename"
            done
          done

      - name: Create/Update Nightly Release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly ${{ steps.version.outputs.date }} (${{ steps.version.outputs.short_hash }})
          body: |
            Nightly build from ${{ steps.version.outputs.date }} (commit ${{ steps.version.outputs.short_hash }}).

            **Firmware files:**
            - `esp32/esp32-firmware.bin` – for ESP32 (Wemos D1 mini)
            - `esp32-s3/esp32-s3-firmware.bin` – for ESP32-S3 (16MB OPI PSRAM)

            Diese Version wird mit jedem neuen Nightly-Build überschrieben.
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            artifacts/esp32/*.bin
            artifacts/esp32/*.elf
            artifacts/esp32-s3/*.bin
            artifacts/esp32-s3/*.elf
