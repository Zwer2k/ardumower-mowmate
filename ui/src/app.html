<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<style>
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background: #f4f4f4;
				z-index: 9999;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			}
			#initial-loader .loader-title {
				color: #161616;
				font-size: 1.25rem;
				font-weight: 600;
				margin-bottom: 1rem;
			}
			#initial-loader .loader-bar-track {
				width: min(80vw, 320px);
				height: 8px;
				background: #e0e0e0;
				border-radius: 4px;
				overflow: hidden;
			}
			#initial-loader .loader-bar {
				width: 100%;
				height: 100%;
				background: #0f62fe;
				border-radius: 4px;
				transform: translateX(-100%);
				animation: loader-progress 2s ease-in-out infinite;
			}
			#initial-loader .loader-subtitle {
				color: #525252;
				font-size: 0.875rem;
				margin-top: 0.75rem;
			}
			@keyframes loader-progress {
				0% { transform: translateX(-100%); }
				50% { transform: translateX(0%); }
				100% { transform: translateX(100%); }
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="initial-loader">
			<div class="loader-title">MowMate</div>
			<div class="loader-bar-track"><div class="loader-bar"></div></div>
			<div class="loader-subtitle">Lade Anwendung...</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
